<!DOCTYPE html> <html lang="ja"> <head>     <meta charset="UTF-8">     <title>MP3 Normalizer</title>     <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>     <style>         body { font-family: monospace; background: #fff; color: #000; padding: 20px; }         input, button { margin: 10px 0; font-family: monospace; }         button { display: block; padding: 5px 10px; }         #status { margin-top: 10px; }     </style> </head> <body>     <h2>MP3 Normalizer</h2>     <input type="file" id="audioFile"><br>     <button id="processBtn" disabled>変換（音圧強）</button>     <button id="rawProcessBtn" disabled>変換（元音質）</button>     <div id="status"></div>      <script>         const audioFileInput = document.getElementById('audioFile');         const processBtn = document.getElementById('processBtn');         const rawProcessBtn = document.getElementById('rawProcessBtn');         const statusDiv = document.getElementById('status');          audioFileInput.addEventListener('change', (e) => {             if (e.target.files.length > 0) {                 processBtn.disabled = false;                 rawProcessBtn.disabled = false;                 statusDiv.innerText = "選択完了";             }         });          async function loadAudio() {             const file = audioFileInput.files[0];             if (!file) return null;             const arrayBuffer = await file.arrayBuffer();             const ctx = new (window.AudioContext || window.webkitAudioContext)();             statusDiv.innerText = "デコード中...";             const audioBuffer = await ctx.decodeAudioData(arrayBuffer);             return { audioBuffer, name: file.name.replace(/\.[^/.]+$/, "") };         }          async function process(targetSampleRate, isCompressed) {             const data = await loadAudio();             if (!data) return;                          const { audioBuffer, name } = data;             const numChannels = audioBuffer.numberOfChannels;              statusDiv.innerText = "処理中...";              let minAmp = Infinity;             for (let ch = 0; ch < numChannels; ch++) {                 const d = audioBuffer.getChannelData(ch);                 for (let i = 0; i < d.length; i++) {                     const abs = Math.abs(d[i]);                     if (abs > 0 && abs < minAmp) minAmp = abs;                 }             }             const mult = minAmp === Infinity ? 1.0 : 1.0 / minAmp;              const processed = [];             for (let ch = 0; ch < numChannels; ch++) {                 const d = audioBuffer.getChannelData(ch);                 const buf = new Float32Array(d.length);                 for (let i = 0; i < d.length; i++) {                     let v = d[i] * mult;                     if (v > 1.0) v = 1.0;                     if (v < -1.0) v = -1.0;                     buf[i] = v;                 }                 processed.push(buf);             }              const targetSamples = Math.floor(audioBuffer.duration * targetSampleRate);             const offline = new OfflineAudioContext(numChannels, targetSamples, targetSampleRate);             const srcBuf = offline.createBuffer(numChannels, audioBuffer.length, audioBuffer.sampleRate);             for (let c = 0; c < numChannels; c++) srcBuf.copyToChannel(processed[c], c);              const src = offline.createBufferSource();             src.buffer = srcBuf;             src.connect(offline.destination);             src.start(0);              const rendered = await offline.startRendering();             statusDiv.innerText = "エンコード中...";              const blob = encodeMP3(rendered, targetSampleRate, isCompressed ? 64 : 128);                          const a = document.createElement('a');             a.href = URL.createObjectURL(blob);             a.download = `${name}_out.mp3`;             a.click();              statusDiv.innerText = `完了 (${(blob.size / 1024 / 1024).toFixed(2)} MB)`;             processBtn.disabled = false;             rawProcessBtn.disabled = false;         }          function encodeMP3(audioBuffer, sampleRate, kbps) {             const numChannels = audioBuffer.numberOfChannels;             const encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, kbps);             const data = [];             const block = 1152;             const left = audioBuffer.getChannelData(0);             const right = numChannels > 1 ? audioBuffer.getChannelData(1) : null;              const l16 = new Int16Array(left.length);             const r16 = right ? new Int16Array(right.length) : null;              for (let i = 0; i < left.length; i++) {                 let s = Math.max(-1, Math.min(1, left[i]));                 l16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;                 if (right) {                     let sr = Math.max(-1, Math.min(1, right[i]));                     r16[i] = sr < 0 ? sr * 0x8000 : sr * 0x7FFF;                 }             }              for (let i = 0; i < l16.length; i += block) {                 const cl = l16.subarray(i, i + block);                 const cr = r16 ? r16.subarray(i, i + block) : null;                 const buf = numChannels === 1 ? encoder.encodeBuffer(cl) : encoder.encodeBuffer(cl, cr);                 if (buf.length > 0) data.push(buf);             }             const end = encoder.flush();             if (end.length > 0) data.push(end);              return new Blob(data, { type: 'audio/mp3' });         }          processBtn.onclick = async () => {             processBtn.disabled = true;             rawProcessBtn.disabled = true;             await process(11025, true);         };          rawProcessBtn.onclick = async () => {             processBtn.disabled = true;             rawProcessBtn.disabled = true;             const data = await loadAudio();             if (data) await process(data.audioBuffer.sampleRate, false);         };     </script> </body> </html>
